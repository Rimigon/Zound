<!doctype html>
<html lang="ru" data-theme="">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zound</title>
    <script>
      // Применяем тему до первого кадра — иначе светлая мигает через
      // тёмную при загрузке. Если включён auto-режим, атрибут не ставим
      // вообще — палитра придёт через prefers-color-scheme в CSS.
      (function () {
        try {
          var auto = localStorage.getItem("zound.themeAuto") === "1";
          if (auto) return;
          var t = localStorage.getItem("zound.theme");
          var valid = ["dark", "light", "midnight", "sunset", "forest", "ocean", "mono"];
          if (valid.indexOf(t) !== -1) {
            document.documentElement.dataset.theme = t;
          }
        } catch (_) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app" class="app">
      <header class="bar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <img src="logo.png" alt="" />
          </div>
          <div>
            <div class="brand-name" data-i18n="app-title">Zound</div>
            <div class="tagline" data-i18n="app-subtitle">Мультиустройственный аудио-хаб</div>
          </div>
        </div>

        <div class="bar-divider" aria-hidden="true"></div>

        <div class="master" role="group" data-i18n-aria-label="master-label">
          <label class="master-mute" id="master-mute-wrap" data-muted="false" data-i18n-title="master-mute">
            <input type="checkbox" id="master-mute" />
            <svg class="icon-lg master-mute-icon" aria-hidden="true"><use href="#i-unmute"/></svg>
          </label>
          <div class="master-slider-wrap">
            <div class="master-label">
              <span class="master-label-l" data-i18n="master-label">Общая громкость</span>
              <span class="master-numeric">
                <span class="v" id="master-gain-value">100</span><span class="u">%</span>
              </span>
            </div>
            <div class="slider-fill" id="master-fill" style="--val:100;">
              <span class="fill"></span>
              <input type="range" class="slider" id="master-gain" min="0" max="100" value="100" data-i18n-title="master-label" />
            </div>
          </div>
        </div>

        <div class="globals">
          <button class="lang-select" id="lang-toggle" type="button" data-i18n-title="language-label">
            <span class="ru-opt active">RU</span>
            <span class="sep">/</span>
            <span class="en-opt">EN</span>
          </button>
          <button class="icon-btn" id="theme-toggle" type="button" data-i18n-title="theme-toggle-title" aria-label="Theme">
            <svg class="icon-lg" aria-hidden="true"><use href="#i-palette"/></svg>
          </button>
          <button class="engine-btn" id="engine-toggle" type="button" data-state="stopped">
            <svg class="icon" aria-hidden="true"><use href="#i-play"/></svg>
            <span class="engine-label" data-i18n="engine-start">Запустить</span>
          </button>
        </div>
      </header>

      <main class="main">
        <section class="panel" aria-label="devices">
          <header class="panel-head">
            <h2>
              <span data-i18n="nav-devices">Устройства</span>
              <span class="count num" id="devices-count">0</span>
            </h2>
            <div class="devices-filter" role="group">
              <button class="filter-chip" id="filter-outputs" type="button" aria-pressed="true">
                <svg class="icon" aria-hidden="true"><use href="#i-speaker"/></svg>
                <span data-i18n="filter-outputs">Выходы</span>
              </button>
              <button class="filter-chip" id="filter-all" type="button" aria-pressed="false">
                <svg class="icon" aria-hidden="true"><use href="#i-mic"/></svg>
                <span data-i18n="filter-show-inputs">Показать входы</span>
              </button>
            </div>
          </header>
          <div class="panel-body">
            <div id="devices" class="device-list"></div>
          </div>
        </section>

        <section class="panel" aria-label="mixer">
          <header class="panel-head mixer-head">
            <h2>
              <span data-i18n="nav-mixer">Микшер</span>
              <span class="count num" id="actives-count">0</span>
            </h2>
            <div id="sync-widget-mount"></div>
          </header>
          <div class="panel-body">
            <div id="active-outputs"></div>
          </div>
        </section>
      </main>

      <footer class="status-bar">
        <div class="status-msgs" id="status"></div>
      </footer>

      <div id="update-toast" class="update-toast" hidden></div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
