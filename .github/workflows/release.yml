name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux deps (WebKitGTK + audio headers)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libjack-jackd2-dev \
            libpulse-dev \
            libssl-dev \
            patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Build & publish via tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Подпись updater-артефактов (отдельно от code signing). Пара
          # ключей сгенерирована `tauri signer generate`; публичный — в
          # tauri.conf.json (plugins.updater.pubkey). При наличии этих
          # переменных tauri-action подписывает каждый bundle (.sig) и
          # генерирует latest.json — его и читает tauri-plugin-updater.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: 'Zound ${{ github.ref_name }}'
          releaseBody: |
            **Zound** — мультиустройственный аудио-хаб на Rust + Tauri.
            Снимает системный звук через loopback и синхронно раздаёт на
            несколько устройств одновременно, с per-device громкостью и
            ручной компенсацией задержки.

            ---

            ## Что нового в 0.5.0

            ### Полный редизайн UI
            - **Новый визуальный язык** — pro-audio инструмент, плотная сетка, **янтарный сигнальный акцент** (как у LED-VU-метра), типопара **Geist + Geist Mono** с tabular-nums во всех числовых readout-ах. Light-тема — тёплая фарфоровая база (не инверсия dark-а), общий акцент связывает обе темы.
            - **Шапка переразмечена в три зоны**: бренд, master-блок (главный объект шапки с большим моно-readout-ом), глобальные контролы. Тогл «показывать все устройства» переехал в шапку панели устройств как сегментированный chip-переключатель.
            - **Список устройств заметно перерисован.** Активные устройства отличаются янтарной боковой планкой и tinted-фоном — видно сразу, без чтения action-кнопки. Default — отдельный pill-tag в зелёном. Source-устройство — inline warn-блок внутри карточки, без размытого тонирования всего блока.
            - **Микшер собран по-новому.** Header строки: имя + group-pill + быстрые actions (mute / rename / reset). Primary: Volume с встроенным L/R-peak-метром и dB-шкалой + Latency с tick-марками. Balance + EQ ушли в collapsible «Advanced» — открывается, если у устройства есть нестандартные значения.
            - **Sync переработан в единый widget**: лейбл + sparkline истории дрейфа (16 Гц, цвет переключается ok↔drift) + numeric drift/target + кнопка-toggle «Linked». Заменил два мелких бейджа.

            ### Состояния, навигация, лого
            - **Empty states**. «Движок остановлен» — концентрические dashed-ring + EQ-глиф + клавиатурный хинт `Space`. «Нет активных устройств» — стрелка влево к панели устройств. Сразу понятно, что делать.
            - **Update переехал в плавающий toast** в правый верхний угол — больше не двигает контент при появлении / прогрессе. Footer — timeline последних трёх статусов с opacity-fade старых.
            - **Иконки вместо эмодзи.** Единый inline-SVG sprite (`icons.js`, ~26 символов) — всё через `currentColor`, размер `.icon`/`.icon-lg`. Кросс-платформенно стабильнее, чем 🔇🔊🌓⏹⟲.
            - **Окно стартует 1280 × 800 и по центру экрана**. На узких ноутбук-дисплеях больше не нужно ловить углы. Лого в шапке — `logo.png` из репо вместо placeholder-марки.

            ### Прочее
            - **Версия в `app/tauri.conf.json` и `Cargo.toml` подтянута до 0.5.0.**
            - **i18n: 19 новых ключей** (`nav-mixer`, `filter-*`, `tag-*`, `sync-drift`, `sync-target`, `ctrl-advanced`, `empty-engine-*`, `empty-active-*`, `warning-source-*`, `update-available-title`, `group-add`, `group-members`) — парность ru/en проверяется `build.rs`-ом на сборке.

            ---

            ## Что в этой сборке

            - 🎧 WASAPI loopback — захват системного аудио на Windows.
            - 🔊 Параллельный вывод на N устройств (наушники, колонки, BT).
            - 🎚 Индивидуальная громкость на каждое устройство, realtime.
            - ⏱ Ручная задержка-слайдер → общая цель пересчитывается сама.
            - 🔁 Авто-ресемплинг при разных SR (44.1 ↔ 48 kHz).
            - 🛡 Защита от feedback-loop (нельзя добавить source-устройство).
            - 🔄 Список устройств обновляется автоматически каждые 2 с.
            - ▶️⏹ Старт/стоп прямо из UI.
            - 🌐 Переключаемый интерфейс ru / en (Project Fluent).

            ## Какую сборку качать

            | ОС | Файл | Что делать дальше |
            |---|---|---|
            | Windows 10/11 | `Zound_*_x64_en-US.msi` или `*_x64-setup.exe` | см. Bypass ниже |
            | macOS Apple Silicon (M1/M2/M3) | `Zound_*_aarch64.dmg` | см. Bypass ниже |
            | Linux (Ubuntu/Debian-совместимые) | `Zound_*_amd64.deb` или `*_amd64.AppImage` | `chmod +x` и запуск |

            ## Bypass: обход блокировок (сборка не подписана)

            ### 🪟 Windows — SmartScreen
            Двойной клик на `.msi` → появится синее окно **Защитник Windows SmartScreen** → **Подробнее** → **Выполнить в любом случае**.

            Или заранее через PowerShell:
            ```powershell
            Unblock-File -Path .\Zound_0.5.0_x64_en-US.msi
            ```

            ### 🍎 macOS — Gatekeeper
            Перетащи `Zound.app` из DMG в `/Applications`. На первый запуск будет «Zound повреждён» или «не удаётся проверить разработчика». Один раз выполни в терминале:
            ```bash
            xattr -cr /Applications/Zound.app
            ```
            Затем **правый клик на Zound.app → Открыть → Открыть**.

            ### 🐧 Linux
            AppImage:
            ```bash
            chmod +x Zound_0.5.0_amd64.AppImage
            ./Zound_0.5.0_amd64.AppImage
            ```
            `.deb`:
            ```bash
            sudo dpkg -i Zound_0.5.0_amd64.deb
            ```

            ## Статус платформ

            | ОС | Статус | Что работает |
            |---|---|---|
            | Windows 10/11 | ✅ полноценно | WASAPI loopback + вывод на N устройств |
            | Linux (PipeWire/Pulse) | 🧪 experimental | monitor-source default sink через libpulse-simple |
            | macOS 13+ | 🧪 experimental | ScreenCaptureKit — первый запуск попросит разрешение на запись экрана (нужно даже для audio-only) |

            Linux и macOS бэкенды валидировались только в CI, на живом железе ещё не гонялись. Репортите баги с ОС, выводом `zound --list` и логом `RUST_LOG=debug`.

            ## Известные ограничения

            - **«Двоение» звука** — по дизайну loopback-подхода: система продолжает играть на default-устройстве, Zound дублирует на добавленные. Чтобы слышать только через Zound, убавь громкость на исходном устройстве.
            - Latency калибруется **на слух** слайдером; авто-калибровка — в следующих релизах.
            - Тест-сигнал (щелчок / метроном) ещё не встроен.

            ## Как сообщить о баге

            Issue в этом репо с указанием: ОС, версия Zound, устройства в системе (`zound.exe --list`), что делал, что получил. Приложи лог с `RUST_LOG=debug`.

            ---

            *Это закрытая preview-сборка для тестирования с друзьями. Публичный релиз будет после того, как macOS/Linux backends подтянутся до уровня Windows.*
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Upload workflow artifacts (for manual inspection)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zound-${{ matrix.label }}
          path: |
            target/${{ matrix.target }}/release/bundle/**/*.msi
            target/${{ matrix.target }}/release/bundle/**/*.exe
            target/${{ matrix.target }}/release/bundle/**/*.dmg
            target/${{ matrix.target }}/release/bundle/**/*.app
            target/${{ matrix.target }}/release/bundle/**/*.AppImage
            target/${{ matrix.target }}/release/bundle/**/*.deb
          if-no-files-found: ignore
          retention-days: 14
