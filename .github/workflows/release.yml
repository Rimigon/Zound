name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux deps (WebKitGTK + audio headers)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libjack-jackd2-dev \
            libpulse-dev \
            libssl-dev \
            patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Build & publish via tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Подпись updater-артефактов (отдельно от code signing). Пара
          # ключей сгенерирована `tauri signer generate`; публичный — в
          # tauri.conf.json (plugins.updater.pubkey). При наличии этих
          # переменных tauri-action подписывает каждый bundle (.sig) и
          # генерирует latest.json — его и читает tauri-plugin-updater.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: 'Zound ${{ github.ref_name }}'
          releaseBody: |
            **Zound** — мультиустройственный аудио-хаб на Rust + Tauri.
            Снимает системный звук через loopback и синхронно раздаёт на
            несколько устройств одновременно, с per-device громкостью и
            ручной компенсацией задержки.

            ---

            ## Что нового в 0.4.1

            ### Аудио-ядро — баги и устойчивость
            - **Стабильный backend-id для устройств.** WASAPI endpoint id (Windows, через `IMMDeviceEnumerator`) и AudioObjectID (macOS) сохраняются в `DeviceInfo.endpoint_id`. Session profile теперь матчит устройства по id с fallback на имя — пресет переживает переименование устройства в системе.
            - **Watchdog отключения устройства.** 200 worker-тиков подряд с >50% потерь push → engine выкидывает `OutputDisconnected`-event, фронт убирает плашку устройства автоматически.
            - **Подписка на смену системного default (Windows).** Поллер `GetDefaultAudioEndpoint`: при смене дефолта делается soft-restart capture, во фронте показывается баннер.
            - **`catch_unwind` вокруг audio-thread.** Panic в audio-callback больше не валит процесс; `engine_status.alive=false`, UI показывает «engine died» вместо тишины.
            - **Drift correction без drop/dup кадров.** Через `rubato::set_resample_ratio_relative` — pitch не плывёт при компенсации; на устройствах без ресемплера — fallback на линейный stretch.
            - **Per-thread `CoInitializeEx` (Windows).** Watcher-thread дёргал COM на неинициализированном апартаменте; на release-сборке тесты падали с STATUS_ACCESS_VIOLATION ~1 из 5 запусков. Каждый поток теперь инициализирует свой apartment сам — 15/15 release-прогонов зелёные.

            ### UI и команды
            - **Fire-and-forget Tauri-команды.** Volume / mute / balance / EQ / master не ждут channel-reply — UI отзывчив на каждое движение слайдера, ошибки device-not-found ловятся в audio-thread и пишутся в `tracing::warn!`.
            - **EQ в session profile.** Low / mid / high (dB) сериализуется и восстанавливается между запусками.
            - **`CommandError` enum с `#[serde(tag="kind")]`.** Фронт matches по полю — парсинг строк ушёл, ошибки локализуются предсказуемо.
            - **DTO-консолидация.** `DevicePreset` и `ProfileDeviceDto` слиты в один тип с `serde(rename_all="camelCase")`.

            ### Структурные правки
            - **i18n паритет на этапе сборки.** `app/build.rs` парсит `locales/{ru,en}.ftl`, генерирует `KEYS` в `OUT_DIR` — расхождение ru↔en роняет компиляцию, не дотягивается до релиза.
            - **Frontend разбит на ES-модули.** `state` / `ipc` / `i18n` / `theme` / `status` / `devices` / `mixer` / `sync` / `tests` / `session` / `events` — `app.js` ужался с 1.2k LOC до тонкого роутера.
            - **Tauri capabilities ужесточены.** Только `core:default` + окно `main`, никаких `fs` / `http` / `shell` / `dialog`.
            - **Content Security Policy.** `default-src 'self'`, `no-eval`, `no-inline-scripts` в `tauri.conf.json`.
            - **`DriftCorrector` kp/ki.** Расчёт-обоснование коэффициентов + step-response unit-тест с проверкой монотонной раскачки и cap-а коррекции.
            - **Rate-limited drop-warning.** Накопленные dropped-семплы логируются раз в секунду на устройство, не флудят stderr.

            ### CI
            - **3 платформы под полным тестом.** `clippy --all-targets -- -D warnings` (debug + release), `cargo test --workspace --no-fail-fast` (debug + release), smoke `--self-test` на Windows / macOS / Linux. Lockfile-check, `cargo doc` с `-D rustdoc::broken-intra-doc-links`, fmt-check.
            - **macOS Swift-рантайм rpath.** `screencapturekit-rs` линкует Swift-биндинги без rpath; на macos-runners `libswift_Concurrency.dylib` не находился в dyld cache → SIGABRT в тестах. `build.rs` крейтов `zound-output` и `app` теперь эмитит `-Wl,-rpath,/usr/lib/swift` для линкуемых артефактов.

            ---

            ## Что в этой сборке

            - 🎧 WASAPI loopback — захват системного аудио на Windows.
            - 🔊 Параллельный вывод на N устройств (наушники, колонки, BT).
            - 🎚 Индивидуальная громкость на каждое устройство, realtime.
            - ⏱ Ручная задержка-слайдер → общая цель пересчитывается сама.
            - 🔁 Авто-ресемплинг при разных SR (44.1 ↔ 48 kHz).
            - 🛡 Защита от feedback-loop (нельзя добавить source-устройство).
            - 🔄 Список устройств обновляется автоматически каждые 2 с.
            - ▶️⏹ Старт/стоп прямо из UI.
            - 🌐 Переключаемый интерфейс ru / en (Project Fluent).

            ## Какую сборку качать

            | ОС | Файл | Что делать дальше |
            |---|---|---|
            | Windows 10/11 | `Zound_*_x64_en-US.msi` или `*_x64-setup.exe` | см. Bypass ниже |
            | macOS Apple Silicon (M1/M2/M3) | `Zound_*_aarch64.dmg` | см. Bypass ниже |
            | Linux (Ubuntu/Debian-совместимые) | `Zound_*_amd64.deb` или `*_amd64.AppImage` | `chmod +x` и запуск |

            ## Bypass: обход блокировок (сборка не подписана)

            ### 🪟 Windows — SmartScreen
            Двойной клик на `.msi` → появится синее окно **Защитник Windows SmartScreen** → **Подробнее** → **Выполнить в любом случае**.

            Или заранее через PowerShell:
            ```powershell
            Unblock-File -Path .\Zound_0.2.0_x64_en-US.msi
            ```

            ### 🍎 macOS — Gatekeeper
            Перетащи `Zound.app` из DMG в `/Applications`. На первый запуск будет «Zound повреждён» или «не удаётся проверить разработчика». Один раз выполни в терминале:
            ```bash
            xattr -cr /Applications/Zound.app
            ```
            Затем **правый клик на Zound.app → Открыть → Открыть**.

            ### 🐧 Linux
            AppImage:
            ```bash
            chmod +x Zound_0.2.0_amd64.AppImage
            ./Zound_0.2.0_amd64.AppImage
            ```
            `.deb`:
            ```bash
            sudo dpkg -i Zound_0.2.0_amd64.deb
            ```

            ## Статус платформ

            | ОС | Статус | Что работает |
            |---|---|---|
            | Windows 10/11 | ✅ полноценно | WASAPI loopback + вывод на N устройств |
            | Linux (PipeWire/Pulse) | 🧪 experimental | monitor-source default sink через libpulse-simple |
            | macOS 13+ | 🧪 experimental | ScreenCaptureKit — первый запуск попросит разрешение на запись экрана (нужно даже для audio-only) |

            Linux и macOS бэкенды валидировались только в CI, на живом железе ещё не гонялись. Репортите баги с ОС, выводом `zound --list` и логом `RUST_LOG=debug`.

            ## Известные ограничения

            - **«Двоение» звука** — по дизайну loopback-подхода: система продолжает играть на default-устройстве, Zound дублирует на добавленные. Чтобы слышать только через Zound, убавь громкость на исходном устройстве.
            - Latency калибруется **на слух** слайдером; авто-калибровка — в следующих релизах.
            - Тест-сигнал (щелчок / метроном) ещё не встроен.

            ## Как сообщить о баге

            Issue в этом репо с указанием: ОС, версия Zound, устройства в системе (`zound.exe --list`), что делал, что получил. Приложи лог с `RUST_LOG=debug`.

            ---

            *Это закрытая preview-сборка для тестирования с друзьями. Публичный релиз будет после того, как macOS/Linux backends подтянутся до уровня Windows.*
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Upload workflow artifacts (for manual inspection)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zound-${{ matrix.label }}
          path: |
            target/${{ matrix.target }}/release/bundle/**/*.msi
            target/${{ matrix.target }}/release/bundle/**/*.exe
            target/${{ matrix.target }}/release/bundle/**/*.dmg
            target/${{ matrix.target }}/release/bundle/**/*.app
            target/${{ matrix.target }}/release/bundle/**/*.AppImage
            target/${{ matrix.target }}/release/bundle/**/*.deb
          if-no-files-found: ignore
          retention-days: 14
