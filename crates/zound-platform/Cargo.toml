[package]
name = "zound-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Platform audio backend abstraction for Zound (cpal-based)"

[dependencies]
zound-core.workspace = true
cpal.workspace = true
ringbuf.workspace = true
rubato.workspace = true
thiserror.workspace = true
tracing.workspace = true
parking_lot.workspace = true

# Linux: системный loopback через monitor-source PulseAudio/PipeWire.
# PipeWire предоставляет Pulse-совместимый API — один код работает и там, и там.
# Требует libpulse-dev при сборке.
[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2.28"
libpulse-simple-binding = "2.28"

# macOS 13+: системный loopback через ScreenCaptureKit
# (CoreAudio не даёт loopback без kext-а / виртуального драйвера).
# coreaudio-sys / core-foundation-sys — прямой обход CoreAudio для энумерации
# устройств: `cpal::Host::output_devices()` на macOS фильтрует через
# `default_output_config().is_ok()`, что выкидывает idle-выходы (DisplayPort,
# Built-in, когда они не активны) — идём в обход.
[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "1.5"
coreaudio-sys = { version = "0.2", default-features = false, features = ["audio_unit", "core_audio"] }
core-foundation-sys = "0.8"
