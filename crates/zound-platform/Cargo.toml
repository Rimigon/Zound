[package]
name = "zound-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Platform audio backend abstraction for Zound (cpal-based)"

[dependencies]
zound-core.workspace = true
cpal.workspace = true
ringbuf.workspace = true
rubato.workspace = true
thiserror.workspace = true
tracing.workspace = true
parking_lot.workspace = true

# Linux: системный loopback через monitor-source PulseAudio/PipeWire.
# PipeWire предоставляет Pulse-совместимый API — один код работает и там, и там.
# Требует libpulse-dev при сборке.
[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2.28"
libpulse-simple-binding = "2.28"

# macOS 13+: системный loopback через ScreenCaptureKit
# (CoreAudio не даёт loopback без kext-а / виртуального драйвера).
[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "1.5"
